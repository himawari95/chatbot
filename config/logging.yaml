# =============================================================================
# Chatbot 日志配置（简化格式，由 ConfigManager 程序化加载）
# =============================================================================

# 全局日志级别（DEBUG / INFO / WARNING / ERROR）
level: "INFO"

# 输出目标
outputs:
  # 控制台输出
  console:
    enabled: true
    level: "INFO"

  # 文件输出（按天滚动，保留 7 天）
  file:
    enabled: true
    level: "DEBUG"
    path: "logs/app.log"
    when: "midnight"      # 滚动时机：midnight / H / D
    backup_count: 7       # 保留天数
    encoding: "utf-8"

# JSON 格式开关
json_format: true

# 第三方库日志抑制（减少噪音）
quiet_libs:
  - "httpx"
  - "httpcore"
  - "openai"
  - "urllib3"
  - "asyncio"
  - "aiosqlite"
  - "sqlalchemy"
  - "langchain_classic"
  - "langchain_core"
  - "langchain_openai"
