[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "chatbot"
version = "1.1.0"
description = "LangChain Chat — 多用户、多角色、流式对话聊天机器人"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "gradio",
    "langchain",
    "langchain-classic",
    "langchain-openai",
    "python-dotenv",
    "httpx",
    "sse-starlette",
    "sqlalchemy",
    "aiosqlite",
    "pyyaml",
    "pydantic-settings",
    "rich",
    "prompt_toolkit",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]
